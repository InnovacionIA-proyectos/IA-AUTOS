# Entorno local / desarrollo / QA. Los secretos se leen del archivo .env (no versionado).
# Uso:  docker compose up --build
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD en .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./database:/database:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -I -b -i /database/00-crear-base.sql && /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -d IAAutos -U sa -P "$$MSSQL_SA_PASSWORD" -I -b -i /database/ddl.sql
    restart: "no"

  # Almacen S3 compatible para desarrollo (efimero: las imagenes se pierden al recrear el contenedor; la base de datos si persiste).
  # En produccion se usa el MinIO (u otro S3) existente: basta con configurar
  # Storage__S3__* en el entorno. La imagen oficial de MinIO ya no se publica en registros publicos.
  almacen:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: iaautos
    ports:
      - "9090:9090"

  api:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
      almacen:
        condition: service_started
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=IAAutos;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True
      Storage__S3__Endpoint: http://almacen:9090
      Storage__S3__Bucket: iaautos
      Storage__S3__AccessKey: desarrollo
      Storage__S3__SecretKey: desarrollo-solo-local
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
