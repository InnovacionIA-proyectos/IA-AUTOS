# Entorno local completo: base de datos, almacen de imagenes, API (backend) y web (frontend).
# Requisitos: copiar backend/.env.example a backend/.env y completarlo (ver backend/docs/configuracion.md).
# Para que el navegador pueda llamar a la API, en backend/.env debe estar:  Cors__Origins=http://localhost:4200
# Uso:  docker compose up --build        (web en http://localhost:4200, API en http://localhost:8080)
include:
  - path: backend/docker-compose.yml
    env_file: backend/.env

services:
  web:
    build: frontend
    depends_on:
      - api
    environment:
      # URL de la API tal como la ve el NAVEGADOR (no el nombre del servicio de docker).
      API_URL: ${WEB_API_URL:-http://localhost:8080}
      APK_URL: ${WEB_APK_URL:-}
      INACTIVIDAD_MINUTOS: ${WEB_INACTIVIDAD_MINUTOS:-30}
      PROVEEDOR_LOGIN: ${WEB_PROVEEDOR_LOGIN:-propio}
    ports:
      - "4200:8080"

  # Swagger UI opcional para desarrollo (no arranca por defecto):  docker compose --profile docs up -d swagger
  # Lee el contrato de la API, que requiere Documentacion__Habilitada=true en backend/.env.  http://localhost:8081
  swagger:
    profiles: [docs]
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      URL: ${SWAGGER_OPENAPI_URL:-http://localhost:8080/openapi/v1.json}
    depends_on:
      - api
    ports:
      - "8081:8080"
