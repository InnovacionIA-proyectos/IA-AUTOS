name: Seguridad Backend

# Analisis estatico (CodeQL) y escaneo de dependencias del backend. Corren en runners de GitHub (ubuntu-latest): solo
# compilan, no necesitan la red corporativa ni secretos.
# Repo privado sin GitHub Advanced Security: CodeQL no sube resultados a la pestaña Security; se guardan como artefacto.
on:
  push:
    branches: [main, QA]
    paths:
      - "backend/**"
      - ".github/workflows/seguridad-backend.yml"
  pull_request:
    branches: [main, QA]
    paths:
      - "backend/**"
      - ".github/workflows/seguridad-backend.yml"
  # Tambien semanal: aparecen vulnerabilidades nuevas en paquetes que no han cambiado.
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: read

concurrency:
  group: seguridad-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Analisis de codigo (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Iniciar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      # Compilacion explicita de la solucion: el autobuild de CodeQL busca .sln/.csproj en la raiz y el backend vive en
      # backend/ con un .slnx, asi que se indica el comando exacto.
      - name: Compilar para el analisis
        run: dotnet build backend/IA-AUTOS.slnx -c Release

      # upload: never -> no se envia el SARIF a GitHub (requiere Advanced Security en repos privados).
      # upload-database: false -> tampoco se sube la base de datos de CodeQL.
      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
          output: sarif-results
          upload: never
          upload-database: false

      - name: Resumen de hallazgos
        if: always()
        run: |
          SARIF=$(ls sarif-results/*.sarif 2>/dev/null | head -n 1)
          if [ -z "$SARIF" ]; then
            echo "::warning::No se genero el archivo SARIF."
            exit 0
          fi
          TOTAL=$(jq '[.runs[].results[]?] | length' "$SARIF")
          {
            echo "### Resultados de CodeQL"
            echo "Hallazgos: **$TOTAL**"
            echo ""
            echo "Descarga el artefacto \`codeql-sarif\` para ver el detalle."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt 0 ]; then
            echo "::warning::CodeQL encontro $TOTAL hallazgo(s). Revisa el artefacto codeql-sarif."
            # Para que el job falle cuando haya hallazgos, descomenta la siguiente linea:
            # exit 1
          fi

      - name: Guardar resultados SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
          if-no-files-found: warn
          retention-days: 30

  dependencias:
    name: Escaneo de dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore backend/IA-AUTOS.slnx

      # "dotnet list package --vulnerable" termina con codigo 0 aunque encuentre vulnerabilidades, asi que se lee la salida
      # en JSON: si aparece la clave "vulnerabilities" el paso falla (el formato JSON no depende del idioma del SDK).
      - name: Buscar paquetes con vulnerabilidades (incluye transitivos)
        run: |
          dotnet list backend/IA-AUTOS.slnx package --vulnerable --include-transitive --format json > vulnerabilidades.json
          if grep -q '"vulnerabilities"' vulnerabilidades.json; then
            echo "::error::Hay paquetes NuGet con vulnerabilidades conocidas."
            dotnet list backend/IA-AUTOS.slnx package --vulnerable --include-transitive
            exit 1
          fi
          echo "Sin paquetes vulnerables."